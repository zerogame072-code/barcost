<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Баркост</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#efeff4);
  --text:var(--tg-theme-text-color,#15161a);
  --hint:var(--tg-theme-hint-color,#8a8d93);
  --accent:var(--tg-theme-button-color,#2f7cf6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --line:rgba(128,128,128,.2);
  --ok:#25a244; --warn:#d18a00; --bad:#e5484d;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--tg-theme-bg-color,#1c1d21);
    --bg2:var(--tg-theme-secondary-bg-color,#111214);
    --text:var(--tg-theme-text-color,#f1f1f3);
    --hint:var(--tg-theme-hint-color,#8b8e95);
  }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg2);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{padding:16px 14px calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 2px 14px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:20px;font-weight:700;margin-bottom:14px}
.sub{color:var(--hint);font-size:14px;margin:18px 4px 8px}
.list{background:var(--bg);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--hint);font-size:13px}
.pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.pct small{font-weight:400;font-size:13px;color:var(--hint)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.empty{background:var(--bg);border-radius:14px;padding:22px 16px;color:var(--hint);text-align:center}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-text);font-weight:600}
.full{width:100%;margin-top:14px}
.ghost{background:transparent;color:var(--accent);padding:10px 4px;font-weight:600}
.danger{background:transparent;color:var(--danger);font-weight:600}
.add{background:var(--accent);color:var(--accent-text);font-size:15px;padding:8px 14px;font-weight:600}
.card{background:var(--bg);border-radius:14px;padding:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
label{display:block;font-size:13px;color:var(--hint);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 78px 26px 30px;gap:6px;align-items:center;margin-bottom:8px}
.row input,.row select{margin:0}
.row .u{color:var(--hint);font-size:13px}
.x{background:transparent;color:var(--hint);padding:6px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:5px}
.stepper input{margin:0;text-align:center;font-size:22px;font-weight:700}
.stepper button,.chips button{background:var(--bg2);color:var(--text);font-weight:600;border:1px solid var(--line)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.summary{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-top:12px}
.summary .line{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.summary .line span:first-child{color:var(--hint)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.actions .primary{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:transparent;color:var(--hint);font-size:10.5px;padding:6px 1px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--accent)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:20;transform-origin:left;animation:load 1.2s ease-in-out infinite;display:none}
#bar.on{display:block}
@keyframes load{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .2s}
.overlay.show .sheet{transform:none}
.note{color:var(--hint);font-size:13px;margin-top:8px}
details.ttkf{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.ttkf summary{color:var(--accent);font-weight:600;padding:10px 0;cursor:pointer}
textarea{resize:vertical}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:7px 12px;font-size:14px;background:transparent;color:var(--hint);border-radius:8px}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.back{background:transparent;color:var(--accent);padding:8px 2px;font-weight:600}
.ttkb{font-size:18px}
body.page nav{display:none}
body.page main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.doc{background:#fff;color:#17181b;border-radius:6px;padding:22px 18px;font-size:14px;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.doc h2{font-size:19px;margin:4px 0 10px;letter-spacing:-.01em}
.doc h3{font-size:14px;margin:16px 0 4px}
.doc p{margin:0 0 4px}
.doc .c{text-align:center}
.doc .muted{color:#666}
.doc .approve{margin:0 0 18px auto;width:max-content;max-width:100%;font-size:13px;line-height:1.6}
.scroll{overflow-x:auto}
.tt{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}
.tt th,.tt td{border:1px solid #b4b4b4;padding:5px 7px;text-align:left;vertical-align:top}
.tt th{background:#f1f1f1;font-weight:600}
.tt td.n{text-align:right;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 12px}
.kv span:nth-child(odd){color:#666}
@media print{
  nav,.top,#bar,#ov{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .doc{box-shadow:none;border-radius:0;padding:0;font-size:12pt}
}
@media (prefers-reduced-motion:reduce){.overlay,.sheet{transition:none}#bar{animation:none}}
</style>
</head>
<body>
<div id="bar"></div>
<main id="app"></main>
<nav id="nav">
  <button data-tab="stock"><b>📦</b>Остатки</button>
  <button data-tab="recipes"><b>🍸</b>Коктейли</button>
  <button data-tab="ings"><b>🧴</b>Ингредиенты</button>
  <button data-tab="period"><b>📊</b>Период</button>
  <button data-tab="more"><b>⚙️</b>Ещё</button>
</nav>

<script src="config.js"></script>
<script>
/* Адрес скрипта берётся из файла config.js рядом с index.html */
const API_URL = window.BARCOST_API_URL || '';

const tg = (window.Telegram && window.Telegram.WebApp) || null;
if (tg) { tg.ready(); tg.expand(); }
const CACHE = 'barcost_shared_cache', PDKEY = 'barcost_pd', OLD = 'barcost_v1';

let S = { ingredients: [], recipes: [], periods: [], target: 22, me: '', settings: {} };
let page = null, setTimer;
let PD = {}; try { PD = JSON.parse(localStorage.getItem(PDKEY) || '{}'); } catch (e) {}
let tab = 'stock', status = 'loading', errMsg = '', denied = null, pending = 0, lastLoad = 0, stockQ = '', oldData = null, tgtTimer;

const $ = s => document.querySelector(s);
const app = html => { $('#app').innerHTML = html; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (n, d = 2) => (isFinite(n) ? n : 0).toLocaleString('ru-RU', { maximumFractionDigits: d });
const rub = n => fmt(n) + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sorted = a => [...a].sort((x, y) => x.name.localeCompare(y.name, 'ru'));
const pk = i => i && i.unit === 'мл' ? 'бут.' : 'уп.';
const haptic = () => { try { tg && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
const tgv = v => tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
const ask = (msg, cb) => { if (tgv('6.2')) tg.showConfirm(msg, ok => ok && cb()); else if (confirm(msg)) cb(); };
const alertMsg = m => { if (tgv('6.2')) tg.showAlert(m); else alert(m); };
const savePD = () => { try { localStorage.setItem(PDKEY, JSON.stringify(PD)); } catch (e) {} };

/* ---------- связь с таблицей ---------- */
function api(action, payload = {}, opts = {}) {
  if (!API_URL.startsWith('https://')) { status = 'nourl'; render(); return Promise.resolve(null); }
  pending++; $('#bar').classList.add('on');
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, initData: tg ? tg.initData : '', ...payload })
  })
    .then(r => r.json())
    .then(res => {
      if (res.denied) { denied = res; status = 'denied'; render(); return null; }
      if (res.error) throw new Error(res.error);
      apply(res); return res;
    })
    .catch(e => {
      const msg = e.message === 'Failed to fetch' ? 'нет связи с таблицей' : e.message;
      if (action === 'load') {
        if (!lastLoad) { status = 'error'; errMsg = msg; render(); }
        else if (!opts.quiet) alertMsg('Не удалось обновить: ' + msg);
      } else {
        alertMsg('Не сохранилось: ' + msg);
        api('load', {}, { quiet: true });
      }
      return null;
    })
    .finally(() => { if (--pending <= 0) { pending = 0; $('#bar').classList.remove('on'); } });
}
function apply(res) {
  S = { ingredients: res.ingredients || [], recipes: res.recipes || [], periods: res.periods || [], target: res.target ?? 22, me: res.me || '', settings: res.settings || {}, role: res.role || 'staff' };
  lastLoad = Date.now(); status = 'ok';
  try { localStorage.setItem(CACHE, JSON.stringify(S)); } catch (e) {}
  const a = document.activeElement;
  if (a && a.matches && a.matches('#app input,#app textarea,#app select')) return; // не сбиваем ввод
  render();
}
const refresh = () => { if (Date.now() - lastLoad > 15000) api('load', {}, { quiet: true }); };

/* ---------- расчёты ---------- */
const isAdmin = () => S.role === 'admin';
const ing = id => S.ingredients.find(i => i.id === id);
const unitPrice = i => i && num(i.vol) > 0 ? num(i.price) / num(i.vol) : 0;
const recipeCost = r => r.items.reduce((s, it) => s + unitPrice(ing(it.ing)) * num(it.amt), 0);
const pct = (c, p) => p > 0 ? c / p * 100 : 0;
const cls = p => p <= num(S.target) ? 'ok' : p <= num(S.target) + 5 ? 'warn' : 'bad';

/* ---------- экраны ---------- */
function render() {
  const adminTabs = ['ings', 'period'];
  if (!isAdmin() && adminTabs.includes(tab)) tab = 'stock';
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tab);
    b.style.display = !isAdmin() && status === 'ok' && adminTabs.includes(b.dataset.tab) ? 'none' : '';
  });
  if (status === 'nourl') return app(`<h1>Баркост</h1><div class="empty">Не найден адрес скрипта. Создай рядом с index.html файл config.js со строкой: window.BARCOST_API_URL = 'ссылка /exec';</div>`);
  if (status === 'loading') return app(`<div class="empty" style="margin-top:30px">Загружаю данные…</div>`);
  if (status === 'denied') {
    app(`<h1>Нет доступа</h1><div class="card">${esc(denied.name)}, попроси владельца бара открыть тебе доступ: в таблице на листе «Доступ» напротив твоего имени нужно поставить «да».
      <div class="note">Твой Telegram ID: ${esc(denied.id)}</div><button class="primary full" id="retry">Проверить снова</button></div>`);
    $('#retry').onclick = () => { status = 'loading'; render(); api('load'); };
    return;
  }
  if (status === 'error') {
    app(`<h1>Баркост</h1><div class="empty">Не удалось подключиться: ${esc(errMsg)}.<br><br><button class="primary" id="retry">Повторить</button></div>`);
    $('#retry').onclick = () => { status = 'loading'; render(); api('load'); };
    return;
  }
  document.body.classList.toggle('page', !!page);
  if (page) return vTTK();
  ({ stock: vStock, recipes: vRecipes, ings: vIngs, period: vPeriod, more: vMore })[tab]();
}

function vStock() {
  const total = S.ingredients.reduce((s, i) => s + num(i.stock) * num(i.price), 0);
  app(`<h1>Остатки</h1>
    ${isAdmin() ? `<div class="card" style="margin-bottom:14px"><div class="big">${rub(total)}</div><div class="note" style="margin-top:2px">остаток бара по закупочным ценам</div></div>` : ''}
    ${S.ingredients.length
      ? `<input id="sq" placeholder="Поиск" value="${esc(stockQ)}" style="margin:0 0 10px"><div class="list" id="slist"></div>`
      : `<div class="empty">${isAdmin() ? 'Позиции появятся, когда добавишь ингредиенты.' : 'Список позиций пока пуст.'}</div>`}`);
  if (!S.ingredients.length) return;
  const draw = () => {
    const q = stockQ.trim().toLowerCase();
    const list = sorted(S.ingredients).filter(i => !q || i.name.toLowerCase().includes(q));
    $('#slist').innerHTML = list.length ? list.map(i => `
      <div class="item" data-id="${i.id}"><div class="main"><div class="name">${esc(i.name)}</div>
      <div class="meta">${[isAdmin() ? rub(num(i.stock) * num(i.price)) : '', i.by ? esc(i.by) + ' ' + esc(i.at) : ''].filter(Boolean).join(', ') || 'ещё не обновляли'}</div></div>
      <div class="pct ${num(i.stock) < 1 ? 'warn' : ''}">${fmt(num(i.stock))} <small>${pk(i)}</small></div></div>`).join('')
      : `<div class="item"><div class="meta">Ничего не найдено</div></div>`;
    $('#slist').querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => editStock(el.dataset.id));
  };
  draw();
  $('#sq').oninput = e => { stockQ = e.target.value; draw(); };
}

function vRecipes() {
  const list = sorted(S.recipes);
  if (!isAdmin()) {
    app(`<h1>Коктейли</h1>` + (!list.length ? `<div class="empty">Коктейлей пока нет.</div>` :
      `<div class="list">${list.map(r => `
        <div class="item" data-id="${r.id}"><div class="main"><div class="name">${esc(r.name)}</div>
        <div class="meta">${esc([r.ttk?.method, r.ttk?.glass, yieldText(r)].filter(Boolean).join(', '))}</div></div>
        <div class="pct">📄</div></div>`).join('')}</div>`));
    document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => openPage(el.dataset.id));
    return;
  }
  app(`<h1>Коктейли <button class="add" id="addR">+ Добавить</button></h1>` + (
    !S.ingredients.length ? `<div class="empty">Сначала добавь ингредиенты с ценами на вкладке «Ингредиенты».</div>` :
    !list.length ? `<div class="empty">Добавь первый коктейль: состав в мл и цену продажи. Себестоимость и баркост посчитаются сами.</div>` :
    `<div class="list">${list.map(r => { const c = recipeCost(r), p = pct(c, num(r.price)); return `
      <div class="item" data-id="${r.id}"><div class="main"><div class="name">${esc(r.name)}</div>
      <div class="meta">себестоимость ${rub(c)}, цена ${rub(num(r.price))}</div></div>
      <div class="pct ${cls(p)}">${num(r.price) ? fmt(p, 1) + '%' : '—'}</div>
      <button class="x ttkb" data-ttk="${r.id}" aria-label="ТТК">📄</button></div>`; }).join('')}</div>`));
  $('#addR').onclick = () => S.ingredients.length ? editRecipe() : (tab = 'ings', render());
  document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => editRecipe(el.dataset.id));
  document.querySelectorAll('[data-ttk]').forEach(b => b.onclick = e => { e.stopPropagation(); openPage(b.dataset.ttk); });
}

function vIngs() {
  const list = sorted(S.ingredients);
  app(`<h1>Ингредиенты <button class="add" id="addI">+ Добавить</button></h1>` + (
    !list.length ? `<div class="empty">Добавь бутылку или продукт: объём упаковки и цену закупки. Цена за мл посчитается сама.</div>` :
    `<div class="list">${list.map(i => `
      <div class="item" data-id="${i.id}"><div class="main"><div class="name">${esc(i.name)}</div>
      <div class="meta">${fmt(num(i.vol))} ${esc(i.unit)} за ${rub(num(i.price))}</div></div>
      <div class="pct">${fmt(unitPrice(i))} <small>₽/${esc(i.unit)}</small></div></div>`).join('')}</div>`));
  $('#addI').onclick = () => editIng();
  document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => editIng(el.dataset.id));
}

function vPeriod() {
  const d = PD;
  if (!d.label) d.label = new Date().toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  app(`<h1>Баркост за период</h1>
  <div class="card" id="pform">
    <label>Период<input data-f="label" value="${esc(d.label)}"></label>
    <div class="grid2">
      <label>Остаток на начало, ₽<input data-f="open" inputmode="decimal" value="${esc(d.open)}"></label>
      <label>Закупки, ₽<input data-f="purch" inputmode="decimal" value="${esc(d.purch)}"></label>
      <label>Остаток на конец, ₽<input data-f="close" inputmode="decimal" value="${esc(d.close)}"></label>
      <label>Выручка бара, ₽<input data-f="rev" inputmode="decimal" value="${esc(d.rev)}"></label>
    </div>
    <div class="summary" id="pres"></div>
    <div class="actions"><button class="primary" id="psave">Сохранить в историю</button></div>
  </div>
  <div class="sub">История</div>
  ${S.periods.length ? `<div class="list">${S.periods.slice().reverse().map(p => { const c = num(p.open) + num(p.purch) - num(p.close), x = pct(c, num(p.rev)); return `
    <div class="item"><div class="main"><div class="name">${esc(p.label)}</div>
    <div class="meta">расход ${rub(c)}, выручка ${rub(num(p.rev))}</div></div>
    <div class="pct ${cls(x)}">${fmt(x, 1)}%</div><button class="x" data-del="${p.id}">✕</button></div>`; }).join('')}</div>`
    : `<div class="empty">Здесь появятся сохранённые периоды, чтобы сравнивать месяцы.</div>`}`);
  const draw = () => {
    const c = num(d.open) + num(d.purch) - num(d.close), x = pct(c, num(d.rev));
    $('#pres').innerHTML = `<div class="big ${num(d.rev) ? cls(x) : ''}">${num(d.rev) ? fmt(x, 1) + '%' : '—'}</div>
      <div class="line"><span>Расход (себестоимость проданного)</span><span>${rub(c)}</span></div>
      <div class="line"><span>Цель</span><span>${fmt(num(S.target), 1)}%</span></div>`;
  };
  draw();
  $('#pform').oninput = e => { const f = e.target.dataset.f; if (f) { d[f] = e.target.value; draw(); savePD(); } };
  $('#psave').onclick = () => {
    if (!num(d.rev)) return alertMsg('Введи выручку за период.');
    const per = { id: uid(), label: d.label, open: num(d.open), purch: num(d.purch), close: num(d.close), rev: num(d.rev) };
    S.periods.push(per); PD = {}; savePD(); haptic(); render();
    api('savePeriod', { per });
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    ask('Удалить этот период из истории?', () => { S.periods = S.periods.filter(p => p.id !== b.dataset.del); render(); api('delPeriod', { id: b.dataset.del }); });
  });
}

function vMore() {
  if (!isAdmin()) {
    app(`<h1>Ещё</h1><div class="card">Ты вошёл как ${esc(S.me)}.<br><button class="ghost" id="reload">Обновить данные</button></div>`);
    $('#reload').onclick = () => api('load').then(r => r && haptic());
    return;
  }
  app(`<h1>Ещё</h1>
  <div class="card">
    <label>Целевой баркост, %<input id="tgt" inputmode="decimal" value="${esc(S.target)}"></label>
    <div class="note">Зелёный — в пределах цели, жёлтый — до +5%, красный — выше. Цель общая для всех.</div>
  </div>
  <div class="sub">Для ТТК</div>
  <div class="card" id="sets">
    <label>Организация<input data-s="org" value="${esc(S.settings.org)}" placeholder="ИП Иванов В. В., бар «Авеню»"></label>
    <div class="grid2">
      <label>Должность утверждающего<input data-s="bossTitle" value="${esc(S.settings.bossTitle)}" placeholder="Директор"></label>
      <label>ФИО<input data-s="boss" value="${esc(S.settings.boss)}" placeholder="Иванов В. В."></label>
    </div>
  </div>
  <div class="sub">Доступ</div>
  <div class="card">Ты вошёл как ${esc(S.me)}.
    <div class="note">Новые люди появляются на листе «Доступ» в таблице, когда впервые откроют бота. Напротив имени поставь «да», чтобы человек видел остатки и рецептуры без денег, или «админ», чтобы видел всё. «Нет» закрывает доступ.</div>
    <button class="ghost" id="reload">Обновить данные</button>
  </div>
  ${oldData ? `<div class="sub">Данные из прошлой версии</div><div class="card">
    <div class="note" style="margin:0">На этом устройстве остались ${oldData.ingredients?.length || 0} ингредиентов и ${oldData.recipes?.length || 0} коктейлей из первой версии.</div>
    <button class="primary full" id="mig">Перенести в общую таблицу</button></div>` : ''}`);
  $('#tgt').oninput = e => { S.target = e.target.value; clearTimeout(tgtTimer); tgtTimer = setTimeout(() => api('setTarget', { value: num(S.target) }), 800); };
  $('#sets').oninput = e => { const k = e.target.dataset.s; if (!k) return; S.settings[k] = e.target.value;
    clearTimeout(setTimer); setTimer = setTimeout(() => api('setSetting', { values: { ...S.settings } }), 800); };
  $('#reload').onclick = () => api('load').then(r => r && haptic());
  if (oldData) $('#mig').onclick = () => ask('Перенести старые данные в общую таблицу?', () =>
    api('import', { data: oldData }).then(r => {
      if (!r) return;
      try { localStorage.removeItem(OLD); } catch (e) {}
      if (tgv('6.9')) tg.CloudStorage.removeItem('n', () => {});
      oldData = null; haptic(); render();
    }));
}

/* ---------- нижние панели ---------- */
function openSheet(html) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'ov';
  o.innerHTML = `<div class="sheet">${html}</div>`;
  o.onclick = e => { if (e.target === o) closeSheet(); };
  document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show'));
  if (tgv('6.1')) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}
function closeSheet() {
  const o = $('#ov'); if (o) o.remove();
  if (tgv('6.1')) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
}

function editStock(id) {
  const i = ing(id); if (!i) return;
  openSheet(`<h2>${esc(i.name)}</h2>
    <div class="note" style="margin:-8px 0 14px">1 ${pk(i)} = ${fmt(num(i.vol))} ${esc(i.unit)}${isAdmin() ? ', ' + rub(num(i.price)) : ''}</div>
    <label>Остаток сейчас, ${pk(i)}
      <div class="stepper"><button data-d="-0.25">−¼</button><input id="sV" inputmode="decimal" value="${fmt(num(i.stock))}"><button data-d="0.25">+¼</button></div></label>
    <div class="summary" id="sS"></div>
    <button class="primary full" id="sSave">Сохранить остаток</button>
    <div class="sub">Пришла поставка</div>
    <div class="chips">${[1, 2, 6, 12].map(n => `<button data-add="${n}">+${n}</button>`).join('')}</div>`);
  const draw = () => { const v = num($('#sV').value);
    $('#sS').innerHTML = `<div class="line"><span>Это</span><span>${fmt(v * num(i.vol))} ${esc(i.unit)}</span></div>
      ${isAdmin() ? `<div class="line"><span>На сумму</span><span>${rub(v * num(i.price))}</span></div>` : ''}`; };
  draw(); $('#sV').oninput = draw;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { $('#sV').value = fmt(Math.max(0, num($('#sV').value) + num(b.dataset.d))); draw(); });
  $('#sSave').onclick = () => {
    const v = Math.max(0, num($('#sV').value));
    Object.assign(i, { stock: v, by: S.me, at: 'только что' });
    closeSheet(); render(); haptic();
    api('setStock', { id, stock: v });
  };
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const n = num(b.dataset.add);
    ask(`Добавить ${n} ${pk(i)} к остатку «${i.name}»?`, () => {
      Object.assign(i, { stock: num(i.stock) + n, by: S.me, at: 'только что' });
      closeSheet(); render(); haptic();
      api('addStock', { id, delta: n });
    });
  });
}

function editIng(id) {
  const old = id ? ing(id) : null;
  const d = old ? { ...old } : { id: uid(), name: '', unit: 'мл', vol: '', price: '' };
  openSheet(`<h2>${old ? 'Ингредиент' : 'Новый ингредиент'}</h2>
    <label>Название<input id="iN" value="${esc(d.name)}" placeholder="Джин Beefeater 0,7"></label>
    <div class="grid2">
      <label>Объём / вес упаковки<input id="iV" inputmode="decimal" value="${esc(d.vol)}" placeholder="700"></label>
      <label>Единица<select id="iU">${['мл', 'г', 'шт'].map(u => `<option ${u === d.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
    </div>
    <label>Цена упаковки, ₽<input id="iP" inputmode="decimal" value="${esc(d.price)}" placeholder="1500"></label>
    <div class="summary" id="iS"></div>
    <div class="actions">${old ? '<button class="danger" id="iDel">Удалить</button>' : ''}<button class="primary" id="iSave">Сохранить</button></div>`);
  const draw = () => { d.vol = $('#iV').value; d.price = $('#iP').value; d.unit = $('#iU').value;
    $('#iS').innerHTML = `<div class="line"><span>Цена за 1 ${esc(d.unit)}</span><span>${rub(unitPrice(d))}</span></div>` +
      (d.unit === 'мл' ? `<div class="line"><span>За 50 мл</span><span>${rub(unitPrice(d) * 50)}</span></div>` : ''); };
  draw(); ['#iV', '#iP', '#iU'].forEach(s => $(s).oninput = draw);
  $('#iSave').onclick = () => {
    d.name = $('#iN').value.trim(); if (!d.name) return alertMsg('Введи название.');
    if (!(num(d.vol) > 0)) return alertMsg('Введи объём или вес упаковки.');
    const p = { id: d.id, name: d.name, unit: d.unit, vol: num(d.vol), price: num(d.price) };
    if (old) Object.assign(old, p); else S.ingredients.push({ ...p, stock: 0, by: '', at: '' });
    closeSheet(); render(); haptic();
    api('saveIng', { ing: p });
  };
  if (old) $('#iDel').onclick = () => {
    const used = S.recipes.filter(r => r.items.some(it => it.ing === id)).map(r => r.name);
    ask(used.length ? `Он есть в коктейлях: ${used.join(', ')}. Удалить всё равно?` : 'Удалить ингредиент вместе с его остатком?', () => {
      S.ingredients = S.ingredients.filter(i => i.id !== id);
      S.recipes.forEach(r => r.items = r.items.filter(it => it.ing !== id));
      closeSheet(); render();
      api('delIng', { id });
    });
  };
}

function editRecipe(id) {
  const old = id ? S.recipes.find(r => r.id === id) : null;
  const d = old ? JSON.parse(JSON.stringify(old)) : { id: uid(), name: '', price: '', items: [{ ing: '', amt: '' }] };
  d.ttk = d.ttk || {};
  if (!d.ttk.num) d.ttk.num = String(old ? S.recipes.indexOf(old) + 1 : S.recipes.length + 1);
  const t = d.ttk, tf = (k, lbl, ph = '') => `<label>${lbl}<input data-t="${k}" value="${esc(t[k])}" placeholder="${ph}"></label>`;
  const opts = sel => `<option value="">— выбрать —</option>` + sorted(S.ingredients)
    .map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  openSheet(`<h2>${old ? 'Коктейль' : 'Новый коктейль'}</h2>
    <label>Название<input id="rN" value="${esc(d.name)}" placeholder="Негрони"></label>
    <label>Цена продажи, ₽<input id="rP" inputmode="decimal" value="${esc(d.price)}" placeholder="550"></label>
    <div class="sub" style="margin-top:4px">Состав</div><div id="rows"></div>
    <button class="ghost" id="addRow">+ Ингредиент</button>
    <div class="summary" id="rS"></div>
    <details class="ttkf" ${t.method || t.glass ? '' : 'open'}><summary>Данные для ТТК</summary>
      <div class="grid2">${tf('num', '№ ТТК')}
        <label>Метод<select data-t="method"><option value="">—</option>${Object.keys(METHODS).map(m => `<option ${m === t.method ? 'selected' : ''}>${m}</option>`).join('')}</select></label></div>
      ${tf('glass', 'Бокал', 'Олд фэшн')}
      ${tf('garnish', 'Украшение', 'Цедра апельсина')}
      <label>Технология приготовления<textarea data-t="tech" rows="4" placeholder="Выбери метод, и шаблон подставится сам">${esc(t.tech)}</textarea></label>
      <label>Подача<textarea data-t="serve" rows="2" placeholder="На подставке, с коктейльной салфеткой">${esc(t.serve)}</textarea></label>
      ${tf('yield', 'Выход (если пусто, посчитается из состава)', '120 мл')}
      <div class="sub" style="margin-top:4px">Органолептика, для ТТК по ГОСТ</div>
      ${tf('look', 'Внешний вид', 'Прозрачный, без осадка, в охлаждённом бокале')}
      ${tf('color', 'Цвет', 'Насыщенный рубиновый')}
      ${tf('texture', 'Консистенция', 'Жидкая, однородная')}
      ${tf('taste', 'Вкус', 'Горько-сладкий, с цитрусовыми нотами')}
      ${tf('smell', 'Запах', 'Аромат можжевельника и апельсина')}
      ${tf('nutr', 'Пищевая и энергетическая ценность', 'На 1 порцию: … ккал')}
    </details>
    <div class="actions">${old ? '<button class="danger" id="rDel">Удалить</button>' : ''}<button class="primary" id="rSave">Сохранить</button></div>`);
  $('.ttkf').oninput = e => {
    const f = e.target.dataset.t; if (!f) return;
    t[f] = e.target.value;
    if (f === 'method') {
      const ta = $('.ttkf [data-t="tech"]');
      if (!ta.value.trim() || Object.values(METHODS).includes(ta.value)) { ta.value = METHODS[t.method] || ''; t.tech = ta.value; }
    }
  };
  const drawSum = () => {
    const c = recipeCost(d), p = num(d.price), x = pct(c, p), t = num(S.target);
    $('#rS').innerHTML = `<div class="big ${p ? cls(x) : ''}">${p ? fmt(x, 1) + '%' : '—'}</div>
      <div class="line"><span>Себестоимость</span><span>${rub(c)}</span></div>
      <div class="line"><span>Наценка с порции</span><span>${p ? rub(p - c) : '—'}</span></div>
      <div class="line"><span>Цена при баркосте ${fmt(t, 1)}%</span><span>${t > 0 ? rub(Math.ceil(c / (t / 100) / 10) * 10) : '—'}</span></div>`;
  };
  const drawRows = () => {
    $('#rows').innerHTML = d.items.map((it, k) => { const i = ing(it.ing); return `<div class="row" data-k="${k}">
      <select data-f="ing">${opts(it.ing)}</select>
      <input data-f="amt" inputmode="decimal" placeholder="0" value="${esc(it.amt)}">
      <span class="u">${i ? esc(i.unit) : ''}</span>
      <button class="x" data-rm="${k}">✕</button></div>`; }).join('');
    drawSum();
  };
  drawRows();
  $('#rows').oninput = e => { const row = e.target.closest('.row'), f = e.target.dataset.f; if (!row || !f) return;
    d.items[+row.dataset.k][f] = e.target.value; f === 'ing' ? drawRows() : drawSum(); };
  $('#rows').onclick = e => { const k = e.target.dataset.rm; if (k !== undefined) { d.items.splice(+k, 1); drawRows(); } };
  $('#addRow').onclick = () => { d.items.push({ ing: '', amt: '' }); drawRows(); };
  $('#rP').oninput = e => { d.price = e.target.value; drawSum(); };
  $('#rSave').onclick = () => {
    const name = $('#rN').value.trim(); if (!name) return alertMsg('Введи название коктейля.');
    const items = d.items.filter(it => it.ing && num(it.amt) > 0).map(it => ({ ing: it.ing, amt: num(it.amt) }));
    if (!items.length) return alertMsg('Добавь хотя бы один ингредиент с количеством.');
    const rec = { id: d.id, name, price: num(d.price), items, ttk: d.ttk };
    if (old) Object.assign(old, rec); else S.recipes.push(rec);
    closeSheet(); render(); haptic();
    api('saveRecipe', { rec });
  };
  if (old) $('#rDel').onclick = () => ask('Удалить коктейль?', () => {
    S.recipes = S.recipes.filter(r => r.id !== id); closeSheet(); render(); api('delRecipe', { id });
  });
}

  'Другое': ''
};
const nl = s => esc(s).replace(/\n/g, '<br>');
function yieldText(r) {
  if (r.ttk && r.ttk.yield) return r.ttk.yield;
  const sums = {};
  r.items.forEach(it => { const i = ing(it.ing); if (i) sums[i.unit] = (sums[i.unit] || 0) + num(it.amt); });
  return Object.entries(sums).map(([u, v]) => fmt(v) + ' ' + u).join(' + ') || '—';
}
function openPage(id) {
  page = { id, mode: 'work' }; window.scrollTo(0, 0); render();
  if (tgv('6.1')) { tg.BackButton.show(); tg.BackButton.onClick(closePage); }
}
function closePage() {
  page = null;
  if (tgv('6.1')) { tg.BackButton.offClick(closePage); tg.BackButton.hide(); }
  render();
}
function vTTK() {
  const r = S.recipes.find(x => x.id === page.id);
  if (!r) { page = null; return render(); }
  const t = r.ttk || {}, st = S.settings || {};
  const list = r.items.map(it => { const i = ing(it.ing); return { name: i ? i.name : '(удалённый ингредиент)', unit: i ? i.unit : '', amt: num(it.amt) }; });
  const canPrint = tg && ['tdesktop', 'macos', 'weba', 'webk', 'web'].includes(tg.platform);

    body = `<div class="doc">

    body = `<div class="doc">
      <div class="approve">УТВЕРЖДАЮ<br>${esc(st.bossTitle || 'Руководитель')}${st.org ? '<br>' + esc(st.org) : ''}<br>____________ ${esc(st.boss || '')}<br>«___» ____________ 20___ г.</div>

  app(`<div class="top"><button class="back" id="pBack">‹ Назад</button>

  $('#pBack').onclick = closePage;
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { page.mode = b.dataset.m; render(); });

}

/* ---------- данные из первой версии ---------- */
function findOld() {
  try { const r = JSON.parse(localStorage.getItem(OLD) || 'null'); if (r && (r.ingredients?.length || r.recipes?.length)) oldData = r; } catch (e) {}
  if (oldData || !tgv('6.9')) return;
  tg.CloudStorage.getItem('n', (e, n) => {
    n = parseInt(n); if (e || !n) return;
    const keys = Array.from({ length: n }, (_, i) => 'd' + i);
    tg.CloudStorage.getItems(keys, (e2, v) => {
      if (e2 || !v) return;
      try { const d = JSON.parse(keys.map(k => v[k] || '').join('')); if (d.ingredients?.length || d.recipes?.length) { oldData = d; if (tab === 'more') render(); } } catch (_) {}
    });
  });
}

/* ---------- старт ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { page = null; tab = b.dataset.tab; window.scrollTo(0, 0); render(); if (status === 'ok') refresh(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && status === 'ok') refresh(); });
try { const c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (c) { S = c; status = 'ok'; } } catch (e) {}
render();
api('load');
findOld();
